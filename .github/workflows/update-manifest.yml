name: Mettre à jour manifest.json à la publication d'une release

on:
  release:
    types: [published]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extraire le numéro de version depuis le tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Télécharger modpack.zip depuis la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --pattern "modpack.zip" --output modpack.zip

      - name: Calculer le SHA256
        id: hash
        run: |
          HASH=$(sha256sum modpack.zip | cut -d ' ' -f1)
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour manifest.json (packVersion, packUrl, zipSha256)
        run: |
          jq --arg version "${{ steps.version.outputs.version }}" \
             --arg sha "${{ steps.hash.outputs.sha256 }}" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/modpack.zip" \
             '.packVersion = $version | .zipSha256 = $sha | .packUrl = $url' \
             manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json

      - name: Committer et pousser le manifest mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "chore: mise à jour du manifest pour ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
